spring.application.name=GestionUsuario

# --- 1. CONFIGURACIÓN DE BASE DE DATOS ---
spring.datasource.url=jdbc:mysql://localhost:3307/gestion_usuarios_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# --- 2. CONFIGURACIÓN DE JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
# Desactivamos el SQL para limpiar la consola (Cámbialo a true si necesitas debugear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hibernate 7 detecta el dialecto solo, mejor dejarlo genérico
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Silenciamos la advertencia amarilla de View Rendering
spring.jpa.open-in-view=false



# --- 3. CONFIGURACIÓN DEL SERVIDOR ---
server.port=8080
server.servlet.context-path=/



# --- 4. OPTIMIZACIÓN DE CONSOLA (MODO SILENCIOSO) ---
# Quita el logo de Spring al iniciar
#spring.main.banner-mode=off
# Solo muestra Errores o Advertencias del sistema
logging.level.root=WARN
# Pero permite ver los mensajes de TU propio código (tu lógica)
logging.level.yanfranko.dev=INFO
# Muestra info básica de la web para saber que el servidor arrancó
logging.level.org.springframework.web=INFO


# Forzar la ruta de Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs